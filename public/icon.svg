<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="icon-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18100C" />
      <stop offset="50%" stop-color="#0E0A08" />
      <stop offset="100%" stop-color="#050403" />
    </linearGradient>
    <linearGradient id="icon-glyph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA066" />
      <stop offset="30%" stop-color="#FF7A33" />
      <stop offset="100%" stop-color="#D85A21" />
    </linearGradient>
    <linearGradient id="icon-inner-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFC199" />
      <stop offset="100%" stop-color="#FF6A26" />
    </linearGradient>
    <radialGradient id="icon-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A33" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#D85A21" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="icon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#icon-bg-grad)" />
  <rect width="512" height="512" rx="120" fill="none" stroke="rgba(216,90,33,0.35)" stroke-width="6" />

  <!-- Center Ambient Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#icon-aura)" />

  <!-- Outer Subtle Tech Frame Details -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />

  <!-- Geometric "M" Brand Glyph Group with Subtle Glow -->
  <g filter="url(#icon-glow-filter)">
    <path
      d="M 104 384 V 152 C 104 139 115 128 128 128 H 152 C 165 128 176 136 182 147 L 256 264 L 330 147 C 336 136 347 128 360 128 H 384 C 397 128 408 139 408 152 V 384 C 408 393 401 400 392 400 H 360 C 351 400 344 393 344 384 V 232 L 282 323 C 271 339 241 339 230 323 L 168 232 V 384 C 168 393 161 400 152 400 H 120 C 111 400 104 393 104 384 Z"
      fill="url(#icon-glyph-grad)"
    />

    <!-- Apex Core Node Diamond -->
    <polygon points="256,160 285,199 256,238 227,199" fill="url(#icon-inner-glow)" />
  </g>
</svg>
